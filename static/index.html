
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>WebVision</title>

    <style>
        body {
            background: #17191c;
            color: white;
            font-family: Arial, sans-serif;
            margin: 15px;
        }

        video {
            width: 100%;
            max-height: 65vh;
            background: black;
            border-radius: 12px;
        }

        button {
            padding: 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #start {
            background: #16a34a;
            color: white;
        }

        #stop {
            background: #b91c1c;
            color: white;
        }
    </style>
</head>

<body>

    <h2>WebVision</h2>

    <p id="status">Отключено</p>

    <video id="remoteVideo"
           autoplay
           playsinline
           muted>
    </video>

    <button id="start">Запустить</button>
    <button id="stop">Остановить</button>

    <script src="/static/client.js"></script>

</body>
</html>
